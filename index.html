<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <img src="assets/parrot.png">
            <div>
                <h1>PollyGlot</h1>
                <p>Perfect Translation Every Time</p>
            </div>
        </header>
        <main>
            <form id="translation-form">
                <label id="title-1" class="title" for="text-to-translate">Text to translate 👇</label>
                <textarea id="text-to-translate" placeholder="How are you?" required></textarea>
                <label id="title-2" class="title" for="text-to-translate">Select language 👇</label>
                
                <div id="options" class="hidden">
                    <label class="radio-label" for="french"><input type="radio" id="french" value="french" name="language" required>French <img class="flag" src="assets/fr-flag.png"></label>
                    
                    <label class="radio-label" for="spanish"><input type="radio" id="spanish" value="spanish" name="language" required>Spanish <img class="flag" src="assets/sp-flag.png"></label>
                    
                    <label class="radio-label" for="japanese"><input type="radio" id="japanese" value="japanese" name="language" required>Japanese <img class="flag" src="assets/jpn-flag.png"></label>
                </div>
                <textarea id="translation-result"></textarea>
                
                <button id="translate-btn" type="submit">Translate</button>
            </form>
        </main>
        <script src="index.js" type="module"></script>
    </body>
</html>
